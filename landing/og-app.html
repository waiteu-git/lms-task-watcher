<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1200px; height: 630px; overflow: hidden; }
    .og { width: 1200px; height: 630px; position: relative; overflow: hidden;
          background: linear-gradient(135deg, #0f9e75 0%, #0b7d63 100%);
          display: flex; align-items: center; gap: 56px; padding: 0 80px;
          font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; color: #fff; }
    .og::before { content: ""; position: absolute; top: -160px; right: -140px; width: 560px; height: 560px;
                  border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.16), transparent 70%); }
    .copy { flex: 1; position: relative; z-index: 1; }
    .brandrow { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
    .mark { width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; }
    .wordmark { font-size: 52px; font-weight: 900; letter-spacing: 3px; }
    .badge { display: inline-block; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.35);
             border-radius: 999px; padding: 8px 20px; font-size: 20px; font-weight: 700; margin-bottom: 26px; }
    .title { font-size: 55px; font-weight: 900; line-height: 1.24; letter-spacing: -1px; }
    .title em { font-style: normal; color: #fde68a; }
    .sub { margin-top: 26px; font-size: 24px; opacity: 0.95; line-height: 1.5; }
    .foot { margin-top: 38px; font-size: 21px; font-weight: 700; opacity: 0.92; }
    .phone { width: 296px; flex-shrink: 0; background: #0c1512; border-radius: 44px; padding: 11px;
             position: relative; z-index: 1; box-shadow: 0 30px 60px rgba(6,40,30,0.45); }
    /* 起動アニメーション（ブートロゴ）画面 */
    .screen { background: #ffffff; border-radius: 34px; height: 556px; position: relative;
              display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; padding: 26px; }
    .boot-mark { width: 88px; height: 88px; display: flex; align-items: center; justify-content: center; }
    .boot-lockup { display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .boot-word { font-size: 54px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
    .boot-word .li { color: #12332a; }
    .boot-word .tus { color: #0f9e75; }
    .boot-tag { font-size: 15px; font-weight: 600; letter-spacing: 0.5em; padding-left: 0.5em; color: #8a968f; }
    .boot-copy { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center;
                 font-size: 12px; color: #b4bfba; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div class="og">
    <div class="copy">
      <div class="brandrow">
        <span class="mark"><svg width="52" height="52" viewBox="188.76 203.76 612.48 636.48" fill="none" aria-hidden="true"><g fill="#fff"><path d="M341.683,280.059 L316.683,518.059 A58,58 0 0 1 252.941,569.683 A58,58 0 0 1 201.317,505.941 L226.317,267.941 A58,58 0 0 1 290.059,216.317 A58,58 0 0 1 341.683,280.059 Z"/><path d="M474,220 L604,220 A181,181 0 0 1 785,401 L785,431 A304,304 0 0 1 714.13,626.106 L772.012,683.988 A58,58 0 0 1 772.012,766.012 A58,58 0 0 1 689.988,766.012 L624.055,700.079 L434.324,818.637 A58,58 0 0 1 354.402,800.185 A58,58 0 0 1 372.853,720.263 L539.873,615.898 L432.988,509.012 A58,58 0 0 1 432.988,426.988 A58,58 0 0 1 515.012,426.988 L631.582,543.557 A188,188 0 0 0 669,431 L669,401 A65,65 0 0 0 604,336 L474,336 A58,58 0 0 1 416,278 A58,58 0 0 1 474,220 Z"/></g></svg></span>
        <span class="wordmark">LITUS</span>
      </div>
      <div class="badge">iOS 配信中 ・ Android オープンテスト</div>
      <div class="title">LETUSもCLASSも、<br><em>スマホひとつに。</em></div>
      <div class="sub">課題の締切通知・CLASSの時間割・出席まで、これひとつで。</div>
      <div class="foot">東京理科大 非公式</div>
    </div>
    <div class="phone">
      <div class="screen">
        <div class="boot-lockup">
          <span class="boot-mark"><svg width="88" height="88" viewBox="188.76 203.76 612.48 636.48" fill="none" aria-hidden="true"><g fill="#0f9e75"><path d="M341.683,280.059 L316.683,518.059 A58,58 0 0 1 252.941,569.683 A58,58 0 0 1 201.317,505.941 L226.317,267.941 A58,58 0 0 1 290.059,216.317 A58,58 0 0 1 341.683,280.059 Z"/><path d="M474,220 L604,220 A181,181 0 0 1 785,401 L785,431 A304,304 0 0 1 714.13,626.106 L772.012,683.988 A58,58 0 0 1 772.012,766.012 A58,58 0 0 1 689.988,766.012 L624.055,700.079 L434.324,818.637 A58,58 0 0 1 354.402,800.185 A58,58 0 0 1 372.853,720.263 L539.873,615.898 L432.988,509.012 A58,58 0 0 1 432.988,426.988 A58,58 0 0 1 515.012,426.988 L631.582,543.557 A188,188 0 0 0 669,431 L669,401 A65,65 0 0 0 604,336 L474,336 A58,58 0 0 1 416,278 A58,58 0 0 1 474,220 Z"/></g></svg></span>
          <div class="boot-word"><span class="li">LI</span><span class="tus">TUS</span></div>
          <div class="boot-tag">リタス</div>
        </div>
        <div class="boot-copy">© 2026 waiteu</div>
      </div>
    </div>
  </div>
</body>
</html>
