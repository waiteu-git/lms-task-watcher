<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    ltw-final-grid（足つきT・16px / 32px 用）: ltw-final.svg（マスター）を 64 単位の格子に丸めた版。
    書き出し表: 16・32px = この版 ／ 48px = ltw-final-48.svg ／ 128px 以上 = ltw-final.svg
    出所: 座標はすべて手計算（フォント・既存ロゴ・アイコンセット・画像生成AI 不使用）。

    容器 : 角丸正方形 x64-960 y64-960 rx200 → W=896、中心 (512,512)、色 #CF4E2A
    格子 : 1 マス = 64 単位 = 16px 表示の 1px、32px 表示の 2px。直線の辺はすべて格子線上
    線   : 縦画・横画・足とも t=128 (=0.143W) → 16px で 2px、32px で 4px
           （マスターの横 120 は 16px で 1.875px になりにじむため、格子では 2px に揃える）
    端   : 半円キャップ r=64 (=t/2)。縦画と足の外角（左下）も r=64、内角 3 つは尖ったまま
    作図 : 3 画の和を 1 本の輪郭に展開
      (1) 横画 x256-768 y256-384（行 4-5、列 4-11 @16px）
      (2) 縦画 x448-576 y256-768（列 7-8 @16px、容器の中心軸上）
      (3) 足   x448-768 y640-768（行 10-11、右端は横画の右端に揃える）
    抜き : 右のポケット 192×256 = 3×4px@16（≥2px）、左下の空き 192×384 = 3×6px@16
    丸め : マスターの各辺を最寄りの 64 の倍数へ丸めた結果
             横画 上264→256 下384→384 / 左端228→256 右端764→768
             縦画 左432→448 右560→576 / 足 上656→640 下776→768 / 足先764→768
           マスターの補正（左16・下8・横-8・丸の補い12）は 16px で 0.125〜0.25px、32px で 0.25〜0.5px の量で、
           格子に載せると全部 0 に丸まる。1 マス（16px で 1px）動かす案（左へ 1 マス・足を 1 マス縮める・
           横画を左へ 1 マス延ばす）は 16px で左寄り過多／手書きの t 化／T の非対称化になり、見え方がマスターから
           離れるため採らない。よって直線の配置は元の版 icons-r3/ltw-t-foot.svg と同一（path も同一）
    注意 : マスターを 16・32px へ直接縮めると縦画が 3 列に割れてにじむ（審査で実測）。16・32 は必ずこの版から書き出す
  -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#CF4E2A"/>
  <path fill="#FFFFFF" d="M320 256 H704 A64 64 0 0 1 704 384 H576 V640 H704 A64 64 0 0 1 704 768 H512 A64 64 0 0 1 448 704 V384 H320 A64 64 0 0 1 320 256 Z"/>
</svg>
