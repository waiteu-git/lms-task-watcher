<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>マイページ — LETUS Task Watcher</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent: #6366f1; --text-dark: #0f172a; --text-mid: #475569; --border: #e2e8f0; --bg-pale: #eef2ff; --border-pale: #e0e7ff; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text-dark); background: #fff; line-height: 1.6; font-size: 16px; }
    header { background: #fff; border-bottom: 1px solid var(--border); padding: 14px 20px; }
    header .inner { max-width: 480px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 1rem; font-weight: 900; color: var(--text-dark); text-decoration: none; }
    main { max-width: 480px; margin: 0 auto; padding: 48px 20px 80px; }
    h1 { font-size: 1.5rem; font-weight: 950; margin-bottom: 24px; }
    .card { border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
    .card-label { font-size: 0.8rem; color: var(--text-mid); margin-bottom: 4px; }
    .card-value { font-size: 1.05rem; font-weight: 700; margin-bottom: 16px; }
    .status-inactive { background: var(--bg-pale); border-color: var(--border-pale); }
    button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 999px; font-size: 0.95rem; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.secondary { background: #fff; color: var(--accent); border: 1.5px solid var(--border); margin-top: 10px; }
    .plan-btn { margin-bottom: 8px; }
    .plan-btn.secondary { background: #fff; color: var(--accent); border: 1.5px solid var(--border); }
    .logout-btn { width: auto; background: none; color: var(--text-mid); font-weight: 700; font-size: 0.85rem; padding: 8px 0; text-decoration: underline; }
    .error { background: #fef2f2; color: #dc2626; border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; margin-bottom: 16px; }
    footer { background: #0f172a; color: rgba(255,255,255,0.55); text-align: center; padding: 20px; font-size: 0.82rem; }
    footer a { color: rgba(255,255,255,0.75); }
  </style>
</head>
<body>
<header>
  <div class="inner">
    <a href="index.html" class="logo">LETUS Task Watcher</a>
  </div>
</header>
<main>
  <h1>マイページ</h1>

  <div id="error" class="error" style="display:none;"></div>

  <div id="content"></div>

  <button id="logout-btn" class="logout-btn" type="button">ログアウト</button>
</main>
<footer>
  <a href="index.html">トップページ</a>
  <p style="margin-top:8px;">© 2026 LETUS Task Watcher</p>
</footer>
<script>
  const API_BASE_URL = 'https://api.waiteu.dev'
  const contentEl = document.getElementById('content')
  const errorEl = document.getElementById('error')

  function clearAuthAndRedirect() {
    localStorage.removeItem('authToken')
    localStorage.removeItem('authTokenExpiresAt')
    window.location.href = 'login.html'
  }

  const token = localStorage.getItem('authToken')
  if (!token) {
    clearAuthAndRedirect()
  }

  async function loadStatus() {
    try {
      const res = await fetch(`${API_BASE_URL}/api/subscription/status`, {
        headers: { Authorization: `Bearer ${token}` },
      })

      if (res.status === 401) {
        clearAuthAndRedirect()
        return
      }

      const data = await res.json()

      if (!res.ok) {
        errorEl.textContent = data.error || 'ステータスの取得に失敗しました'
        errorEl.style.display = 'block'
        return
      }

      renderStatus(data)
    } catch {
      errorEl.textContent = 'サーバーに接続できませんでした'
      errorEl.style.display = 'block'
    }
  }

  function renderStatus(data) {
    window.__hasActiveRecurring = Boolean(data.hasActiveRecurring)
    if (data.status === 'active') {
      const periodEndText = data.currentPeriodEnd
        ? new Date(data.currentPeriodEnd).toLocaleDateString('ja-JP')
        : '不明'

      contentEl.innerHTML = `
        <div class="card">
          <p class="card-label">次回請求日</p>
          <p class="card-value">${periodEndText}</p>
          <button id="portal-btn" type="button">支払い方法を管理</button>
        </div>
        <div class="card" id="discord-card">
          <p class="card-label">Discordコミュニティ</p>
          <button id="discord-connect-btn" type="button">Discordと連携する</button>
          <div id="course-list"></div>
        </div>
      `

      document.getElementById('portal-btn').addEventListener('click', openBillingPortal)
      document.getElementById('discord-connect-btn').addEventListener('click', connectDiscord)
      void loadCourses()
    } else {
      const portalButtonHtml = data.hasStripeCustomer
        ? '<button id="portal-btn" type="button" class="secondary">請求履歴を確認</button>'
        : ''

      contentEl.innerHTML = `
        <div class="card status-inactive">
          <p class="card-label">プランを選択</p>
          <div id="plan-warning" class="error" style="display:none;"></div>
          <button class="plan-btn" data-plan="halfyear" type="button">半期パス ¥720（6ヶ月・一回払い）</button>
          <button class="plan-btn" data-plan="year" type="button">年パス ¥1,200（12ヶ月・一回払い）</button>
          <button class="plan-btn secondary" data-plan="monthly" type="button">月額 ¥120</button>
          ${portalButtonHtml}
        </div>
      `

      document.querySelectorAll('.plan-btn').forEach((b) =>
        b.addEventListener('click', () => startCheckout(b.dataset.plan))
      )
      if (data.hasStripeCustomer) {
        document.getElementById('portal-btn').addEventListener('click', openBillingPortal)
      }
    }
  }

  async function startCheckout(plan) {
    // 継続課金が有効な人がパスを選んだら二重課金警告（購入自体はブロックしない）
    if ((plan === 'halfyear' || plan === 'year') && window.__hasActiveRecurring) {
      const warn = document.getElementById('plan-warning')
      if (warn) {
        warn.textContent = '継続課金の月額が有効です。二重課金を避けるため、先に「支払い方法を管理」から月額を解約してください。'
        warn.style.display = 'block'
      }
    }
    try {
      const res = await fetch(`${API_BASE_URL}/api/subscription/checkout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ plan }),
      })
      const data = await res.json()
      if (!res.ok || !data.url) {
        errorEl.textContent = data.error || 'チェックアウトの開始に失敗しました'
        errorEl.style.display = 'block'
        return
      }
      window.location.href = data.url
    } catch {
      errorEl.textContent = 'サーバーに接続できませんでした'
      errorEl.style.display = 'block'
    }
  }

  async function openBillingPortal() {
    const btn = document.getElementById('portal-btn')
    const originalLabel = btn.textContent
    btn.disabled = true
    btn.textContent = '処理中...'

    try {
      const res = await fetch(`${API_BASE_URL}/api/subscription/billing-portal`, {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
      })
      const data = await res.json()

      if (!res.ok || !data.url) {
        errorEl.textContent = data.error || 'カスタマーポータルの取得に失敗しました'
        errorEl.style.display = 'block'
        btn.disabled = false
        btn.textContent = originalLabel
        return
      }

      window.location.href = data.url
    } catch {
      errorEl.textContent = 'サーバーに接続できませんでした'
      errorEl.style.display = 'block'
      btn.disabled = false
      btn.textContent = originalLabel
    }
  }

  const DISCORD_CLIENT_ID = '1522589536356667532'

  async function connectDiscord() {
    try {
      const res = await fetch(`${API_BASE_URL}/api/discord/oauth-state`, {
        headers: { Authorization: `Bearer ${token}` },
      })
      const data = await res.json()

      if (!res.ok || !data.state) {
        errorEl.textContent = data.error || 'Discord連携の準備に失敗しました'
        errorEl.style.display = 'block'
        return
      }

      const redirectUri = encodeURIComponent('https://api.waiteu.dev/api/discord/callback')
      const url = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${redirectUri}&response_type=code&scope=identify%20guilds.join&state=${encodeURIComponent(data.state)}`
      window.location.href = url
    } catch {
      errorEl.textContent = 'サーバーに接続できませんでした'
      errorEl.style.display = 'block'
    }
  }

  async function loadCourses() {
    const courseListEl = document.getElementById('course-list')

    try {
      const res = await fetch(`${API_BASE_URL}/api/user/courses`, {
        headers: { Authorization: `Bearer ${token}` },
      })
      const data = await res.json()

      if (!res.ok) {
        return
      }

      if (data.courses.length === 0) {
        courseListEl.innerHTML = '<p class="card-label">検出されたコースがまだありません。拡張機能でLETUSのコースページを開くと表示されます。</p>'
        return
      }

      courseListEl.innerHTML = data.courses.map((course) => `
        <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:0.85rem;">
          <input type="checkbox" data-course-id="${course.courseId}" ${course.discordRoleWanted ? 'checked' : ''}>
          ${course.courseName}
        </label>
      `).join('')

      courseListEl.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
        checkbox.addEventListener('change', async (e) => {
          const target = e.target
          await fetch(`${API_BASE_URL}/api/user/courses/${target.dataset.courseId}`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ discordRoleWanted: target.checked }),
          })
        })
      })
    } catch {
      courseListEl.innerHTML = '<p class="card-label">コース一覧の取得に失敗しました。</p>'
    }
  }

  document.getElementById('logout-btn').addEventListener('click', clearAuthAndRedirect)

  if (token) {
    void loadStatus()
  }
</script>
</body>
</html>
